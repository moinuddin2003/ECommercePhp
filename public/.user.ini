; Upload limits for this folder.
; Allows up to 5 MB per image and 64 MB per request so that 5 images
; can always be submitted in a single form post.
; (On shared hosting these are the values you are usually allowed to set;
;  on WAMP/XAMPP the main php.ini is used instead and these are ignored.)
upload_max_filesize = 5M
post_max_size = 64M
max_file_uploads = 20